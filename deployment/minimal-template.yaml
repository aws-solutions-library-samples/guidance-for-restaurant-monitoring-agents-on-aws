AWSTemplateFormatVersion: '2010-09-09'
Description: 'Minimal Restaurant Monitoring System'

Parameters:
  ProjectName:
    Type: String
    Default: restaurant-monitor
  Environment:
    Type: String
    Default: production

Resources:
  # Simple DynamoDB table for restaurants
  RestaurantDataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-restaurants-${Environment}'
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName

  # Simple S3 bucket for website
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-web-${Environment}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  RestaurantTableName:
    Description: 'Restaurant data table name'
    Value: !Ref RestaurantDataTable
  WebsiteBucketName:
    Description: 'Website bucket name'
    Value: !Ref WebsiteBucket
