AWSTemplateFormatVersion: '2010-09-09'
Description: 'Strands Agent Chat Workflow with Real SDK Integration'

Parameters:
  ProjectName:
    Type: String
    Default: restaurant-kitchen-assistant
  Environment:
    Type: String
    Default: production
  RestApiId:
    Type: String
  RestApiRootResourceId:
    Type: String

Resources:
  StrandsAgentChatRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-strands-agent-chat-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-restaurants-${Environment}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-equipment-readings-${Environment}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-tickets-${Environment}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-chat-history-${Environment}'
                Condition:
                  StringEquals:
                    'aws:RequestedRegion': !Ref 'AWS::Region'
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-sonnet-20240229-v1:0'
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-haiku-20240307-v1:0'
                Condition:
                  StringEquals:
                    'aws:RequestedRegion': !Ref 'AWS::Region'

  StrandsAgentChatLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-strands-agent-chat-${Environment}'
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !GetAtt StrandsAgentChatRole.Arn
      Timeout: 60
      Environment:
        Variables:
          RESTAURANTS_TABLE: !Sub '${ProjectName}-restaurants-${Environment}'
          EQUIPMENT_TABLE: !Sub '${ProjectName}-equipment-readings-${Environment}'
          TICKETS_TABLE: !Sub '${ProjectName}-tickets-${Environment}'
          CHAT_HISTORY_TABLE: !Sub '${ProjectName}-chat-history-${Environment}'
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from datetime import datetime, timedelta
          import uuid
          from decimal import Decimal
          
          # Strands SDK imports
          try:
              from strands_sdk import StrandsClient, WorkflowRequest
              STRANDS_AVAILABLE = True
          except ImportError:
              print("Strands SDK not available, using fallback")
              STRANDS_AVAILABLE = False
          
          dynamodb = boto3.resource('dynamodb')
          
          def lambda_handler(event, context):
              try:
                  if event.get('httpMethod') == 'OPTIONS':
                      return cors_response()
                  
                  body = json.loads(event.get('body', '{}'))
                  
                  # Check for equipment data from kitchen simulator
                  # Look for various possible formats
                  if ('equipment' in body or 
                      'temperature' in body or 
                      'appliance_name' in body or 
                      'appliance_type' in body or
                      body.get('type') == 'equipment_reading'):
                      
                      # If it's not already wrapped in 'equipment', wrap it
                      if 'equipment' not in body:
                          body = {'equipment': body}
                      
                      return handle_equipment_anomaly({'body': json.dumps(body)})
                  
                  message = body.get('message', '')
                  session_id = body.get('session_id') or f"session_{uuid.uuid4().hex[:8]}"
                  
                  if not message:
                      return error_response('Message is required')
                  
                  response = invoke_strands_chat(message, session_id)
                  
                  return {
                      'statusCode': 200,
                      'headers': cors_headers(),
                      'body': json.dumps({
                          'response': response,
                          'session_id': session_id,
                          'timestamp': datetime.now().isoformat()
                      })
                  }
                  
              except Exception as e:
                  print(f"Error: {str(e)}")
                  return error_response(f"Internal error: {str(e)}")
          
          def handle_equipment_anomaly(event):
              try:
                  body = json.loads(event.get('body', '{}'))
                  equipment_data = body.get('equipment', {})
                  
                  # Log the incoming data for debugging
                  print(f"Received equipment data: {json.dumps(equipment_data)}")
                  
                  # Check for temperature anomaly conditions
                  should_create_ticket = False
                  priority = 'low'
                  
                  if equipment_data.get('status') in ['critical', 'warning', 'anomaly', 'alert']:
                      should_create_ticket = True
                      priority = 'high' if equipment_data.get('status') == 'critical' else 'medium'
                  
                  # Check temperature deviation
                  temp = equipment_data.get('temperature')
                  target_temp = equipment_data.get('target_temperature')
                  if temp and target_temp:
                      deviation = abs(float(temp) - float(target_temp))
                      if deviation > 5:  # More than 5 degrees deviation
                          should_create_ticket = True
                          priority = 'high' if deviation > 10 else 'medium'
                  
                  if should_create_ticket:
                      result = invoke_strands_workflow(equipment_data, priority)
                      
                      # Update location status with color coding
                      update_location_status(equipment_data.get('restaurant_id'), priority)
                      
                      return {
                          'statusCode': 200,
                          'headers': cors_headers(),
                          'body': json.dumps(result)
                      }
                  
                  return {
                      'statusCode': 200,
                      'headers': cors_headers(),
                      'body': json.dumps({'status': 'no_action_needed'})
                  }
                  
              except Exception as e:
                  print(f"Error processing equipment anomaly: {e}")
                  return error_response(f"Error: {str(e)}")
          
          def invoke_strands_workflow(equipment_data, priority='medium'):
              if not STRANDS_AVAILABLE:
                  return fallback_ticket_creation(equipment_data, priority)
              
              try:
                  strands_client = StrandsClient(
                      region=os.environ.get('AWS_REGION', 'us-east-1')
                  )
                  
                  # Calculate temperature deviation for context
                  temp_deviation = 0
                  if equipment_data.get('temperature') and equipment_data.get('target_temperature'):
                      temp_deviation = abs(float(equipment_data.get('temperature')) - float(equipment_data.get('target_temperature')))
                  
                  workflow_request = WorkflowRequest(
                      workflow_id="restaurant-equipment-anomaly",
                      input_data={
                          "equipment": equipment_data,
                          "context": {
                              "restaurant_id": equipment_data.get('restaurant_id'),
                              "temperature": equipment_data.get('temperature'),
                              "target_temperature": equipment_data.get('target_temperature'),
                              "temperature_deviation": temp_deviation,
                              "appliance_type": equipment_data.get('appliance_type'),
                              "appliance_name": equipment_data.get('appliance_name'),
                              "status": equipment_data.get('status'),
                              "priority": priority,
                              "timestamp": datetime.now().isoformat()
                          },
                          "instructions": [
                              "Analyze temperature deviation and determine priority",
                              "Create maintenance ticket with appropriate urgency",
                              "Route to nearest available technician",
                              "Set ETA based on priority and location",
                              "Update location status with appropriate color coding"
                          ]
                      }
                  )
                  
                  workflow_response = strands_client.execute_workflow(workflow_request)
                  
                  if workflow_response.success:
                      ticket_data = workflow_response.output.get('ticket', {})
                      ticket_data['priority'] = priority  # Ensure priority is set
                      save_ticket_to_db(ticket_data)
                      
                      return {
                          'ticket_id': ticket_data.get('ticket_id'),
                          'status': 'created',
                          'priority': priority,
                          'eta': ticket_data.get('eta'),
                          'technician': ticket_data.get('assigned_technician'),
                          'temperature_deviation': temp_deviation,
                          'source': 'strands_workflow'
                      }
                  else:
                      print(f"Strands workflow failed: {workflow_response.error}")
                      return fallback_ticket_creation(equipment_data, priority)
                      
              except Exception as e:
                  print(f"Strands workflow error: {e}")
                  return fallback_ticket_creation(equipment_data, priority)
          
          def invoke_strands_chat(message, session_id):
              if not STRANDS_AVAILABLE:
                  return fallback_chat_response(message)
              
              try:
                  context = get_restaurant_context()
                  
                  strands_client = StrandsClient(
                      region=os.environ.get('AWS_REGION', 'us-east-1')
                  )
                  
                  chat_request = WorkflowRequest(
                      workflow_id="restaurant-chat-assistant",
                      input_data={
                          "message": message,
                          "session_id": session_id,
                          "context": context,
                          "instructions": [
                              "Provide helpful restaurant operations assistance",
                              "Use real-time data from DynamoDB",
                              "Prioritize critical equipment issues",
                              "Maintain conversation context"
                          ]
                      }
                  )
                  
                  chat_response = strands_client.execute_workflow(chat_request)
                  
                  if chat_response.success:
                      response_text = chat_response.output.get('response', 'I can help with restaurant operations.')
                      save_chat_message(session_id, message, response_text)
                      return response_text
                  else:
                      print(f"Strands chat failed: {chat_response.error}")
                      return fallback_chat_response(message)
                      
              except Exception as e:
                  print(f"Strands chat error: {e}")
                  return fallback_chat_response(message)
          
          def save_ticket_to_db(ticket_data):
              try:
                  table = dynamodb.Table(os.environ['TICKETS_TABLE'])
                  
                  item = {
                      'ticket_id': ticket_data.get('ticket_id', f"STRANDS-{uuid.uuid4().hex[:8].upper()}"),
                      'location_id': ticket_data.get('restaurant_id'),
                      'appliance_name': ticket_data.get('appliance_name'),
                      'description': ticket_data.get('description'),
                      'priority': ticket_data.get('priority', 'high'),
                      'status': 'open',
                      'created_at': datetime.now().isoformat(),
                      'source': 'strands_workflow'
                  }
                  
                  if ticket_data.get('eta'):
                      item['eta'] = ticket_data['eta']
                  if ticket_data.get('assigned_technician'):
                      item['technician'] = ticket_data['assigned_technician']
                  
                  table.put_item(Item=item)
                  print(f"Saved Strands ticket {item['ticket_id']} to DynamoDB")
                  
              except Exception as e:
                  print(f"Error saving ticket to DB: {e}")
          
          def fallback_ticket_creation(equipment_data, priority='medium'):
              try:
                  table = dynamodb.Table(os.environ['TICKETS_TABLE'])
                  ticket_id = f"FALLBACK-{uuid.uuid4().hex[:8].upper()}"
                  
                  # Calculate temperature info for description
                  temp_info = ""
                  if equipment_data.get('temperature') and equipment_data.get('target_temperature'):
                      temp_deviation = abs(float(equipment_data.get('temperature')) - float(equipment_data.get('target_temperature')))
                      temp_info = f" - Current: {equipment_data.get('temperature')}°F, Target: {equipment_data.get('target_temperature')}°F, Deviation: {temp_deviation:.1f}°F"
                  
                  item = {
                      'ticket_id': ticket_id,
                      'location_id': equipment_data.get('restaurant_id'),
                      'appliance_name': equipment_data.get('appliance_name', 'Unknown Equipment'),
                      'description': f"{equipment_data.get('appliance_name', 'Equipment')} temperature anomaly{temp_info}",
                      'priority': priority,
                      'status': 'open',
                      'created_at': datetime.now().isoformat(),
                      'source': 'fallback',
                      'equipment_status': equipment_data.get('status', 'anomaly')
                  }
                  
                  table.put_item(Item=item)
                  print(f"Created fallback ticket {ticket_id} for {equipment_data.get('appliance_name')}")
                  return {'ticket_id': ticket_id, 'status': 'created', 'priority': priority, 'source': 'fallback'}
                  
              except Exception as e:
                  print(f"Fallback ticket creation failed: {e}")
                  return {'status': 'error', 'message': str(e)}
          
          def fallback_chat_response(message):
              msg = message.lower()
              if 'issue' in msg or 'problem' in msg:
                  return "I can help with restaurant issues. Please check the dashboard for current status."
              elif 'ticket' in msg:
                  return "You can view maintenance tickets on the main dashboard."
              else:
                  return "I'm here to help with restaurant operations. Ask about issues, tickets, or equipment status."
          
          def get_restaurant_context():
              try:
                  context = {}
                  
                  restaurants_table = dynamodb.Table(os.environ['RESTAURANTS_TABLE'])
                  restaurants = restaurants_table.scan().get('Items', [])
                  context['restaurants'] = restaurants
                  
                  tickets_table = dynamodb.Table(os.environ['TICKETS_TABLE'])
                  tickets = tickets_table.scan().get('Items', [])
                  context['tickets'] = tickets
                  
                  equipment_table = dynamodb.Table(os.environ['EQUIPMENT_TABLE'])
                  equipment = equipment_table.scan().get('Items', [])
                  context['equipment'] = equipment
                  
                  return context
              except Exception as e:
                  print(f"Error getting context: {e}")
                  return {}
          
          def update_location_status(restaurant_id, priority):
              """Update restaurant location status with color coding based on priority"""
              try:
                  if not restaurant_id:
                      return
                  
                  table = dynamodb.Table(os.environ['RESTAURANTS_TABLE'])
                  
                  # Determine status color based on priority
                  status_colors = {
                      'high': 'red',
                      'critical': 'red',
                      'medium': 'yellow',
                      'warning': 'yellow',
                      'low': 'green'
                  }
                  
                  status_color = status_colors.get(priority, 'yellow')
                  
                  # Update the restaurant status (use 'id' as key, not 'restaurant_id')
                  table.update_item(
                      Key={'id': restaurant_id},
                      UpdateExpression='SET #status = :status, #color = :color, #updated = :updated',
                      ExpressionAttributeNames={
                          '#status': 'status',
                          '#color': 'status_color',
                          '#updated': 'last_updated'
                      },
                      ExpressionAttributeValues={
                          ':status': f'equipment_issue_{priority}',
                          ':color': status_color,
                          ':updated': datetime.now().isoformat()
                      }
                  )
                  
                  print(f"Updated location {restaurant_id} status to {status_color} ({priority} priority)")
                  
              except Exception as e:
                  print(f"Error updating location status: {e}")
          
          def save_chat_message(session_id, user_message, bot_response):
              try:
                  table = dynamodb.Table(os.environ['CHAT_HISTORY_TABLE'])
                  timestamp = datetime.now().isoformat()
                  ttl = int((datetime.now() + timedelta(days=7)).timestamp())
                  
                  table.put_item(
                      Item={
                          'session_id': session_id,
                          'timestamp': timestamp,
                          'user_message': user_message,
                          'bot_response': bot_response,
                          'ttl': ttl
                      }
                  )
              except Exception as e:
                  print(f"Error saving chat: {e}")
          
          def cors_response():
              return {
                  'statusCode': 200,
                  'headers': cors_headers(),
                  'body': ''
              }
          
          def cors_headers():
              return {
                  'Content-Type': 'application/json',
                  'Access-Control-Allow-Origin': '*',
                  'Access-Control-Allow-Methods': 'POST, OPTIONS',
                  'Access-Control-Allow-Headers': 'Content-Type'
              }
          
          def error_response(message):
              return {
                  'statusCode': 400,
                  'headers': cors_headers(),
                  'body': json.dumps({'error': message})
              }

  # API Gateway Resources
  StrandsAgentChatResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApiId
      ParentId: !Ref RestApiRootResourceId
      PathPart: strands-agent-chat

  StrandsAgentChatMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApiId
      ResourceId: !Ref StrandsAgentChatResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${StrandsAgentChatLambda.Arn}/invocations'

  StrandsAgentChatOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApiId
      ResourceId: !Ref StrandsAgentChatResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${StrandsAgentChatLambda.Arn}/invocations'

  StrandsAgentChatLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref StrandsAgentChatLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApiId}/*/*'

  # Force API Gateway deployment to include new resources
  StrandsApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - StrandsAgentChatMethod
      - StrandsAgentChatOptionsMethod
    Properties:
      RestApiId: !Ref RestApiId
      StageName: prod
      Description: 'Deploy Strands agent chat endpoint'

Outputs:
  StrandsAgentChatLambdaArn:
    Value: !GetAtt StrandsAgentChatLambda.Arn
  StrandsAgentChatLambdaName:
    Value: !Ref StrandsAgentChatLambda